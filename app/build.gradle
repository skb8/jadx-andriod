plugins { id 'com.android.application' }

def jadx = '1.5.6'

android {
    namespace 'io.github.skb8.jadxandroid'
    compileSdk 35
    buildFeatures { buildConfig true }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        ndkBuild { path file('src/main/jni/Android.mk') }
    }

    defaultConfig {
        applicationId 'io.github.skb8.jadxandroid'
        minSdk 33
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'JADX_VERSION', "\"$jadx\""
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            merges += ['META-INF/services/**']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation "io.github.skylot:jadx-core:$jadx"
    ['dex', 'java', 'smali', 'aab', 'apks', 'apkm', 'xapk'].each { input ->
        implementation "io.github.skylot:jadx-${input}-input:$jadx"
    }
    implementation "io.github.skylot:jadx-rename-mappings:$jadx"
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'com.github.tony19:logback-android:3.0.0'
}
